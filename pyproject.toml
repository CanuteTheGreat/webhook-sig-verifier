[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "webhook-sig-verifier"
dynamic = ["version"]
description = "Verify and debug webhook signatures: GitHub, Stripe, Slack, Shopify, Standard Webhooks and generic HMAC"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.7"
authors = [{ name = "Errant Solutions", email = "hello@errant.solutions" }]
keywords = ["webhook", "hmac", "signature", "stripe", "github", "standard-webhooks"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://errant.solutions/tools/webhook-sig-verifier.html"
Source = "https://git.canutethegreat.com/CanuteTheGreat/webhook-sig-verifier"
Changelog = "https://git.canutethegreat.com/CanuteTheGreat/webhook-sig-verifier/src/branch/master/CHANGELOG.md"
Releases = "https://git.canutethegreat.com/CanuteTheGreat/webhook-sig-verifier/releases"

[project.scripts]
webhook-sig-verifier = "webhook_sig_verifier:main"

[tool.hatch.version]
path = "webhook_sig_verifier.py"

[tool.hatch.build.targets.wheel]
only-include = ["webhook_sig_verifier.py"]

[tool.hatch.build.targets.sdist]
only-include = ["webhook_sig_verifier.py", "README.md", "LICENSE", "CHANGELOG.md", "tests", "claims.json"]

[tool.mutmut]
# ci/mutation.sh (nightly workflow)
source_paths = ["webhook_sig_verifier.py"]
pytest_add_cli_args_test_selection = ["tests/"]
also_copy = ["claims.json", "README.md", "CHANGELOG.md"]

